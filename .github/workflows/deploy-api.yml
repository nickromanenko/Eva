name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # The gate (#67). Until this existed, a merge to main deployed straight to production
  # Cloud Run with nothing run against it — no typecheck, no test. A red suite now stops
  # the deploy rather than being noticed afterwards.
  #
  # It runs against the Firebase emulators and is granted no GCP credential of its own;
  # `permissions` in the called workflow, not inherited from here.
  test:
    uses: ./.github/workflows/test-api.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        env:
          # Where the activation and reset links point (#6). The API refuses to boot
          # without it, so catch a missing variable here rather than on the revision.
          PUBLIC_WEB_URL: ${{ vars.PUBLIC_WEB_URL }}
          POSTMARK_FROM: ${{ vars.POSTMARK_FROM }}
        run: |
          test -n "$PUBLIC_WEB_URL" || { echo "::error::PUBLIC_WEB_URL repo variable is not set"; exit 1; }
          test -n "$POSTMARK_FROM" || { echo "::error::POSTMARK_FROM repo variable is not set"; exit 1; }
          gcloud run deploy eva-api \
            --source api \
            --project ${{ vars.GCP_PROJECT_ID }} \
            --region ${{ vars.GCP_REGION }} \
            --allow-unauthenticated \
            --set-env-vars "FIREBASE_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},FIREBASE_WEB_API_KEY=${{ vars.GCP_FIREBASE_WEB_API_KEY }},EMAIL_TRANSPORT=postmark,POSTMARK_FROM=$POSTMARK_FROM,PUBLIC_WEB_URL=$PUBLIC_WEB_URL" \
            --set-secrets "JWT_SECRET=eva-jwt-secret:latest,POSTMARK_API_KEY=eva-postmark-key:latest"
