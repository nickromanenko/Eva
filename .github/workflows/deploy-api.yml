name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # The gate (#67). Until this existed, a merge to main deployed straight to production
  # Cloud Run with nothing run against it — no typecheck, no test. A red suite now stops
  # the deploy rather than being noticed afterwards.
  #
  # It runs against the Firebase emulators and is granted no GCP credential of its own;
  # `permissions` in the called workflow, not inherited from here.
  test:
    uses: ./.github/workflows/test-api.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        env:
          # Where the activation and reset links point (#6). The API refuses to boot
          # without it, so catch a missing variable here rather than on the revision.
          PUBLIC_WEB_URL: ${{ vars.PUBLIC_WEB_URL }}
          POSTMARK_FROM: ${{ vars.POSTMARK_FROM }}
          # Apple and Google sign-in (#7, docs/PROVIDER-SIGNIN.md). Deliberately *not*
          # guarded with `test -n` the way the two above are: `config.ts` reads all of
          # these with `optionalString`, and an unprovisioned deploy is a supported state
          # in which the provider routes answer 503 rather than the API refusing to boot.
          GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
          APPLE_CLIENT_ID: ${{ vars.APPLE_CLIENT_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ vars.APPLE_KEY_ID }}
        run: |
          test -n "$PUBLIC_WEB_URL" || { echo "::error::PUBLIC_WEB_URL repo variable is not set"; exit 1; }
          test -n "$POSTMARK_FROM" || { echo "::error::POSTMARK_FROM repo variable is not set"; exit 1; }
          # All three Apple variables or none. `appleCredentials()` treats a partial group
          # as unconfigured, which is the right call at runtime — a half-signed client
          # secret is one Apple rejects — but it means clearing one variable turns token
          # revocation off *silently*, and revocation is deliberately non-fatal, so
          # `DELETE /me` would go on answering 200 with the App Review requirement unmet.
          # Nobody would see it. A partial group is always a mistake; say so here, where
          # someone is watching. (`APPLE_SIGNIN_KEY` lives in Secret Manager and cannot be
          # checked from this side.)
          apple_set=0
          for v in "$APPLE_CLIENT_ID" "$APPLE_TEAM_ID" "$APPLE_KEY_ID"; do
            test -n "$v" && apple_set=$((apple_set + 1))
          done
          if [ "$apple_set" -ne 0 ] && [ "$apple_set" -ne 3 ]; then
            echo "::error::APPLE_CLIENT_ID, APPLE_TEAM_ID and APPLE_KEY_ID must be set together or not at all ($apple_set of 3 set); Apple token revocation would be silently disabled"
            exit 1
          fi
          # The two clinical-constant groups (#191). Both are all-or-nothing at boot, so a
          # missing one is loud — but *absent* is silent and looks identical to working:
          # with no DASHBOARD_PATTERN_*, `patternRung` throws on its first statement and
          # `GET /me/today` answered 503 to every user for weeks while every check was green.
          #
          # Values, not repo variables, and deliberately: these are published constants with
          # citations (A25-A27 from FIGO AUB System 1 and Wilcox BMJ 2000; A32 from the card
          # copy itself), not secrets, and they already live in api/.env.example. A clinical
          # threshold should change in a reviewed diff, not in a settings page nobody diffs.
          CYCLE_ENV="CYCLE_MIN_LENGTH_DAYS=21,CYCLE_MAX_LENGTH_DAYS=45,CYCLE_HISTORY_CYCLES=6,CYCLE_MIN_CYCLES_FOR_ESTIMATE=3,CYCLE_NARROW_BAND_MIN_CYCLES=6,CYCLE_LUTEAL_PHASE_DAYS=14,CYCLE_FERTILE_DAYS_BEFORE_OVULATION=5,CYCLE_FERTILE_DAYS_AFTER_OVULATION=1,CYCLE_PEAK_DAYS_BEFORE_OVULATION=2,CYCLE_MIN_PERIOD_GAP_DAYS=2,CYCLE_IRREGULAR_YOUNG_MAX_AGE=25,CYCLE_IRREGULAR_MID_MAX_AGE=41,CYCLE_IRREGULAR_YOUNG_VARIATION_DAYS=9,CYCLE_IRREGULAR_MID_VARIATION_DAYS=7,CYCLE_IRREGULAR_OLDER_VARIATION_DAYS=9"
          PATTERN_ENV="DASHBOARD_PATTERN_LOW_SIGNAL_DAYS=3,DASHBOARD_PATTERN_LOW_AT_OR_BELOW=2,DASHBOARD_PATTERN_SEVERE_SYMPTOM_DAYS=3"

          # Drift check. GUARDRAILS 2 requires every var to be declared in api/.env.example,
          # so that file is the surface to compare against: a fifteenth CYCLE_* added to
          # config.ts and declared there, but not set here, makes the group partial and the
          # container fail to start. Catching it at deploy says which variable, while someone
          # is watching, instead of in a crash loop.
          for group in CYCLE DASHBOARD_PATTERN; do
            case "$group" in
              CYCLE) set_here=$(echo "$CYCLE_ENV" | tr ',' '\n' | cut -d= -f1 | sort) ;;
              *)     set_here=$(echo "$PATTERN_ENV" | tr ',' '\n' | cut -d= -f1 | sort) ;;
            esac
            declared=$(grep -oE "^${group}_[A-Z_]+" api/.env.example | sort)
            if [ "$set_here" != "$declared" ]; then
              echo "::error::${group}_* in api/.env.example and in this workflow disagree; the group is all-or-nothing and the container will not start"
              diff <(echo "$declared") <(echo "$set_here") | sed 's/^/::error::/' || true
              exit 1
            fi
          done
          # `--allow-unauthenticated` with no `--ingress` keeps the run.app URL publicly
          # reachable, which is what RATE_LIMIT_TRUSTED_PROXY_HOPS's default of 1 assumes: a
          # direct Cloud Run service, one trusted X-Forwarded-For entry (#37). Raising it to
          # 2 for an external load balancer is only half the change — add
          # `--ingress=internal-and-cloud-load-balancing` here in the same change, or anyone
          # can call run.app directly. With no X-Forwarded-For that request carries a
          # one-entry header, resolves to no caller, and skips per-IP throttling. Worse, a
          # caller who sends one entry gets a two-entry header, and the API keys on the
          # address the caller wrote, so it can pick a fresh per-IP budget on every request.
          # Both hit every auth, token and provider route and the export route (#149, #305).
          # config.ts and ARCHITECTURE §3 carry the full reasoning.
          gcloud run deploy eva-api \
            --source api \
            --project ${{ vars.GCP_PROJECT_ID }} \
            --region ${{ vars.GCP_REGION }} \
            --allow-unauthenticated \
            --set-env-vars "FIREBASE_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},FIREBASE_WEB_API_KEY=${{ vars.GCP_FIREBASE_WEB_API_KEY }},EMAIL_TRANSPORT=postmark,POSTMARK_FROM=$POSTMARK_FROM,PUBLIC_WEB_URL=$PUBLIC_WEB_URL,GOOGLE_IOS_CLIENT_ID=$GOOGLE_IOS_CLIENT_ID,APPLE_CLIENT_ID=$APPLE_CLIENT_ID,APPLE_TEAM_ID=$APPLE_TEAM_ID,APPLE_KEY_ID=$APPLE_KEY_ID,$CYCLE_ENV,$PATTERN_ENV" \
            --set-secrets "JWT_SECRET=eva-jwt-secret:latest,POSTMARK_API_KEY=eva-postmark-key:latest,APPLE_SIGNIN_KEY=eva-apple-signin-key:latest"

      # The purge job runs the same image as the service with the entrypoint overridden
      # (#28). `gcloud run deploy` above rebuilds the service and leaves the job on whatever
      # image it was created with, so without this the job drifts stale — a job that deletes
      # health data, silently running an old retention window. Point it at the image just
      # deployed. A human creates the job (ARCHITECTURE §4); until it exists this skips
      # rather than failing the deploy.
      - name: Update the purge job's image
        run: |
          IMAGE=$(gcloud run services describe eva-api \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --format="value(spec.template.spec.containers[0].image)")
          if gcloud run jobs describe eva-purge-events \
              --project "${{ vars.GCP_PROJECT_ID }}" \
              --region "${{ vars.GCP_REGION }}" >/dev/null 2>&1; then
            gcloud run jobs update eva-purge-events \
              --image "$IMAGE" \
              --project "${{ vars.GCP_PROJECT_ID }}" \
              --region "${{ vars.GCP_REGION }}"
            echo "updated eva-purge-events to $IMAGE"
          else
            echo "eva-purge-events does not exist yet — skipping (a human creates it; ARCHITECTURE §4)"
          fi
