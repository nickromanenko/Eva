name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "firebase.json"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build site
        working-directory: website
        env:
          # Inlined into /activate and /reset at build time, so a missing value
          # would ship pages that call nowhere — fail here instead.
          PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          test -n "$PUBLIC_API_BASE_URL" || { echo "::error::API_BASE_URL repo variable is not set (gh variable set API_BASE_URL --body https://<cloud-run-url>)"; exit 1; }
          bun install --frozen-lockfile
          bun run build

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --project ${{ vars.GCP_PROJECT_ID }} --non-interactive
