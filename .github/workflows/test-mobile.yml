# Runs the iOS suite — `xcodegen`, the build, `EvaTests` and `EvaUITests` — against the
# Firebase emulators (#135).
#
# Before this existed, nothing ran the iOS suite anywhere. `docs/ARCHITECTURE.md` §6 said so
# plainly: "A human, when they remember". The cost of that is measured, not theoretical —
# the suite sat red across at least two merges and accumulated three independent breakages,
# the first of which meant the UI target did not compile at all. Nobody was told, because
# there was nobody to tell.
#
# It is also what makes `docs/AUTONOMY.md`'s merge condition 1 — "CI is green on the PR,
# which since #67 means the suites actually ran" — meetable for a `mobile/` PR. Until now no
# workflow matched `mobile/` paths, so a mobile-only PR reported no checks at all and the
# condition could not be satisfied by anything.
#
# **Two jobs, because #67 declined per-PR macOS runners on cost and that call still holds.**
# macOS minutes bill at a 10x multiplier and the full suite is ~10 minutes of wall clock.
# So the split is by what each catches:
#
#   build (pull_request) — xcodegen, the Info.plist staleness guard (#42), and a compile
#     of every target, `EvaTests` and `EvaUITests` included. Minutes, not tens of minutes.
#     Catches the class that actually broke: a Swift 6 error in a test target, which is
#     what #38 shipped and #135 found two merges later.
#
#     It compiles the test targets only since `verify-mobile.sh --build` was moved to
#     `build-for-testing`. Written against plain `build`, it compiled the app alone and
#     caught none of that class — which is how `EvaUITests` came to sit on `main` for nine
#     files without ever compiling under CI's Xcode, behind green pull requests.
#   suite (push to main, and nightly) — the whole thing, including XCUITests. Catches the
#     rest before it compounds across merges, which is the part of #135 that hurt.
#
# A third job, `paths`, is not a test of the app: it keeps the two trigger path lists below
# identical (#317), on ubuntu, in seconds.
#
# **The toolchain is pinned, not inherited (#230).** `macos-15`'s default Xcode is 16.4
# (iPhoneSimulator18.5.sdk), while the "Pick a simulator" step deliberately selects the
# newest runtime the image carries (iOS 26.2 at the time of writing). An 18.5-linked binary
# running on a 26.2 runtime takes 18.5-era SwiftUI code paths, so the suite was never
# testing the binary the app actually ships — and a CI failure was never evidence of a
# defect in the app anyone runs. Both jobs therefore set `DEVELOPER_DIR` to Xcode 26.2, whose
# SDK is `iphonesimulator26.2`, the same major version as the runtime, and print the pairing
# in the first screen of the log. The build destination is also pinned to `arch=arm64`, so
# the "Using the first of multiple matching destinations" warning — the same udid listed
# under both arm64 and x86_64 — cannot reappear. If the image's newest runtime moves past
# 26.2, the pin moves with it *deliberately*, never by image drift.
#
# Emulators only: no Workload Identity Federation, no GCP token, no contact with the real
# project, and deliberately not granted the `id-token` permission that would let it try —
# the same posture as test-api.yml and test-rules.yml, and for the same reason. A workflow
# triggered by `pull_request` runs code from the branch, so it must not be able to reach
# anything. `scripts/ci-mobile.sh` is the harness; its header carries the emulator caveat.
name: Test Mobile

on:
  pull_request:
    paths:
      - "mobile/**"
      - "scripts/ci-mobile.sh"
      - "scripts/verify-mobile.sh"
      # The harness verify-mobile.sh and ci-mobile.sh run around the app: the API launcher
      # and log redaction, the UI-test mailbox, the refdata seed and the end-of-run sweep.
      # Each can fail the suite on its own, without a line of the app changing.
      - "scripts/lib/api-server.sh"
      - "api/scripts/uitest-mailbox.ts"
      - "api/scripts/seed-refdata.ts"
      - "scripts/e2e-cleanup.ts"
      # The UI suite drives the real API, so an api/ change can break it without touching
      # a single file under mobile/. Kept narrow on purpose: the whole of api/** would run
      # a 10x-billed macOS job on every backend PR.
      #
      # The api/ entries are the set of files the iOS client has a *contract* with — it
      # decodes their shapes, so a change there is a change the app's wire types mirror.
      # Not "every file the server imports": content.ts, dashboard-rules.ts, the auth maths
      # and the transports feed the server, never the client. A reader adding another file
      # should be able to tell whether the app decodes it — read the Decodable types under
      # mobile/Eva/, not the filename.
      - "api/src/index.ts"   # route response shapes and the error codes
      - "api/src/users.ts"   # User, Profile, MEDICATION_CODES, CONDITION_CODES
      - "api/src/events.ts"  # EvaEvent and its payloads
      - "api/src/refdata.ts" # the symptom/sport/appointment catalogues
      - "api/src/cycle.ts"   # the prediction confidence/withheld codes
      - "api/src/today.ts"   # the Today card shape
      - ".github/workflows/test-mobile.yml"
      - "scripts/verify-mobile-paths.sh"
  push:
    branches: [main]
    paths:
      # Identical to the pull_request list above, entry for entry: a PR-only guard catches
      # nothing on the nightly, and a push-only guard catches nothing before merge. The two
      # had drifted (#317); the `paths` job below now fails when they differ. Comments are
      # kept on the pull_request list only — the check compares entries, not comments.
      - "mobile/**"
      - "scripts/ci-mobile.sh"
      - "scripts/verify-mobile.sh"
      - "scripts/lib/api-server.sh"
      - "api/scripts/uitest-mailbox.ts"
      - "api/scripts/seed-refdata.ts"
      - "scripts/e2e-cleanup.ts"
      - "api/src/index.ts"
      - "api/src/users.ts"
      - "api/src/events.ts"
      - "api/src/refdata.ts"
      - "api/src/cycle.ts"
      - "api/src/today.ts"
      - ".github/workflows/test-mobile.yml"
      - "scripts/verify-mobile-paths.sh"
  schedule:
    # 04:00 UTC. The suite is the only check on a surface whose dependencies — Xcode, the
    # simulator runtime, the Swift version — move underneath it without any commit. #135's
    # first cause was exactly that: a key path that compiled until the toolchain changed.
    - cron: "0 4 * * *"
  workflow_dispatch:

# Read-only, and no `id-token`. Nothing here needs to write to the repo or reach Google.
permissions:
  contents: read

jobs:
  paths:
    # #317: the push and pull_request path lists above must be identical, and Actions has no
    # way to share one list between them (it rejects YAML anchors). Seconds on ubuntu, not
    # macOS. It runs whenever this file changes — the file is on its own path list — which
    # is the only way either list can change.
    name: Path lists in step
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Compare push and pull_request paths
        run: scripts/verify-mobile-paths.sh

  build:
    # Every trigger. On a pull request this is the whole check; on main and the nightly it
    # is the fast fail, so a compile break reports in minutes rather than after the suite.
    name: Build
    runs-on: macos-15
    timeout-minutes: 20
    env:
      # #230: see the header. The image default (Xcode 16.4 / iOS 18.5 SDK) must not decide.
      DEVELOPER_DIR: /Applications/Xcode_26.2.app
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit-count stamp (`git rev-list --count HEAD` in mobile/project.yml) needs
          # the whole history; the default depth of 1 leaves CFBundleVersion at 1 and
          # BuildStampTests red.
          fetch-depth: 0

      # The pairing an operator reads first: which Xcode, which SDK. A CI-only failure has
      # to be diagnosable without inference, and this is the line that says it out loud.
      - name: Show Xcode and iOS SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks 2>/dev/null | grep -i iphonesimulator || true

      - name: Install xcodegen
        run: brew install xcodegen

      # `verify-mobile.sh` defaults to a UDID that exists on one developer's machine, so
      # every job here has to resolve one that exists on the runner. **Deterministic on
      # purpose**: the image ships several runtimes (18.5 through 26.2 at the time of
      # writing), and taking whatever comes first would silently change what "the suite
      # passed" means between runs. Newest runtime, preferred model, and the choice is
      # printed — the same reason the API's URL is printed by api-server.sh.
      - name: Pick a simulator
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          def runtime_key(name):
              part = name.rsplit(".", 1)[-1].replace("iOS-", "")
              return [int(n) for n in part.split("-")]
          best = None
          for runtime, entries in devices.items():
              if "iOS" not in runtime:
                  continue
              for d in entries:
                  if "iPhone" not in d["name"]:
                      continue
                  # Prefer the Pro, then any iPhone, then newest runtime.
                  rank = (runtime_key(runtime), "Pro" in d["name"], d["name"])
                  if best is None or rank > best[0]:
                      best = (rank, d, runtime)
          if best is None:
              sys.exit("no iPhone simulator available on this runner")
          os_version = ".".join(str(n) for n in best[0][0])
          print(best[1]["udid"], best[1]["name"], f"iOS {os_version}", sep="\t")
          ')
          echo "EVA_SIMULATOR_ID=${udid%%$'\t'*}" >> "$GITHUB_ENV"
          echo "simulator: $udid"

      # `--build` needs no API, no emulators and no simulator boot: it regenerates the
      # project, fails if mobile/Eva/Info.plist is stale (#42), and compiles every target.
      # It does still need a destination that exists, which is what the step above resolves.
      #
      # "Every target" became true later than this comment claimed it. Until
      # `verify-mobile.sh` was switched to `build-for-testing`, this compiled the app
      # alone — the scheme lists the test targets under `test:`, not `build:` — so the one
      # class of breakage the job was written to catch, "a Swift 6 error in a test target",
      # was the one class it could not see. `EvaUITests` sat uncompilable on `main` for
      # nine files and several merges, each of them merged green.
      - name: Build
        run: scripts/verify-mobile.sh --build

      # The .xcresult, uploaded on success AND failure — the failing run is the one worth
      # reading. It carries the build log (or per-test results, failure messages,
      # attachments, timings and the accessibility hierarchy captured at each failure), and a
      # discarded bundle turns a one-query question into a 25-45 minute re-dispatch (#228).
      # `du -sh` reports the size on every run so it is checked, not assumed; retention-days
      # is the storage control (a bundle is tens to low hundreds of MB with screenshots).
      - name: Record xcresult size
        if: always()
        run: du -sh mobile/build/Eva.xcresult 2>/dev/null || echo "no xcresult produced"

      - name: Upload xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-${{ github.job }}-run${{ github.run_id }}-${{ github.sha }}
          path: mobile/build/Eva.xcresult
          if-no-files-found: ignore
          retention-days: 5

  suite:
    # Not on pull_request — see the header. This is the 10x-billed job.
    name: Full suite (emulators)
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: macos-15
    # The ceiling is for a hang — a simulator that never boots, a JVM emulator that never
    # comes up — not for a slow run. On the macOS runner a full job is estimated at ~58 min
    # (2026-09-25: ~10 min setup + ~35 min for the 21 of 27 UI tests that ran before 45 cut
    # it off, + ~12 min for the rest; single UI tests take 60–260 s). 45 cancelled every
    # run on main from 2026-09-24 16:10 while every test passed (#326). 90 leaves ~50%;
    # re-measure from a completed run and raise it deliberately, never let it silently cut.
    # Re-measured for #328 with 30 UI tests: 55–63 min on main before it, 45 min after
    # (the harness stopped paying `waitForExistence`'s first poll on every tap). 90 stays:
    # the headroom is for new tests, not a reason to lower the ceiling.
    timeout-minutes: 90
    env:
      # #230: see the header. The image default (Xcode 16.4 / iOS 18.5 SDK) must not decide.
      DEVELOPER_DIR: /Applications/Xcode_26.2.app
    steps:
      - uses: actions/checkout@v4
        with:
          # Same commit-count stamp as the build job — see the comment there.
          fetch-depth: 0

      # The pairing an operator reads first: which Xcode, which SDK. A CI-only failure has
      # to be diagnosable without inference, and this is the line that says it out loud.
      - name: Show Xcode and iOS SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks 2>/dev/null | grep -i iphonesimulator || true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The Firestore and Auth emulators are JVM processes.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Cache emulator binaries
        uses: actions/cache@v4
        with:
          # Distinct from test-api.yml's and test-rules.yml's keys: cache entries are
          # immutable per key, so a shared one means whichever workflow writes first wins
          # and the others never save. This one also sits on a different runner OS.
          key: firebase-emulators-mobile-${{ runner.os }}-v1
          path: ~/.cache/firebase/emulators

      # `verify-mobile.sh` defaults to a UDID that exists on one developer's machine, so
      # every job here has to resolve one that exists on the runner. **Deterministic on
      # purpose**: the image ships several runtimes (18.5 through 26.2 at the time of
      # writing), and taking whatever comes first would silently change what "the suite
      # passed" means between runs. Newest runtime, preferred model, and the choice is
      # printed — the same reason the API's URL is printed by api-server.sh.
      - name: Pick a simulator
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          def runtime_key(name):
              part = name.rsplit(".", 1)[-1].replace("iOS-", "")
              return [int(n) for n in part.split("-")]
          best = None
          for runtime, entries in devices.items():
              if "iOS" not in runtime:
                  continue
              for d in entries:
                  if "iPhone" not in d["name"]:
                      continue
                  # Prefer the Pro, then any iPhone, then newest runtime.
                  rank = (runtime_key(runtime), "Pro" in d["name"], d["name"])
                  if best is None or rank > best[0]:
                      best = (rank, d, runtime)
          if best is None:
              sys.exit("no iPhone simulator available on this runner")
          os_version = ".".join(str(n) for n in best[0][0])
          print(best[1]["udid"], best[1]["name"], f"iOS {os_version}", sep="\t")
          ')
          echo "EVA_SIMULATOR_ID=${udid%%$'\t'*}" >> "$GITHUB_ENV"
          echo "simulator: $udid"

      - name: Run mobile suite
        env:
          FIREBASE_CLI: bunx firebase-tools@15
        run: scripts/ci-mobile.sh

      # Same upload as the build job — see the comment there. The suite's bundle is the one
      # with real weight: per-test results and the accessibility hierarchy at each failure.
      - name: Record xcresult size
        if: always()
        run: du -sh mobile/build/Eva.xcresult 2>/dev/null || echo "no xcresult produced"

      - name: Upload xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-${{ github.job }}-run${{ github.run_id }}-${{ github.sha }}
          path: mobile/build/Eva.xcresult
          if-no-files-found: ignore
          retention-days: 5

      # The server side of a failed suite (#263): the API's and the UI-test mailbox's logs,
      # which verify-mobile.sh copies to mobile/build/suite-logs/ on exit. Without them a UI
      # test that hung on a request could say *that* it waited, and nothing could say whether
      # the API ever answered — the `request` line (route pattern, status, ms) and
      # `request_timeout` are what decide it, and they lived in a mktemp file on a runner that
      # no longer exists.
      #
      # **On failure or cancellation only**, unlike the xcresult: a green run's logs answer no
      # question, and an artifact on every nightly is storage for nothing. `cancelled()` is
      # not optional: a job killed by `timeout-minutes` ends *cancelled*, not failed, so
      # `failure()` alone skips this step — and a hung request is exactly the run that ends
      # that way, which is the case this upload exists for. The first two dispatch runs of
      # #263 both hit the 45-minute ceiling and uploaded nothing. A manual cancel uploads too;
      # that costs one small artifact. **Redacted, not raw**: under `EMAIL_TRANSPORT=log` the
      # API prints every activation link and the address it went to, and an artifact
      # outlives the runner and, the repository being public, is downloadable by anyone
      # (ARCHITECTURE.md §6a); `redact_suite_log` in scripts/lib/api-server.sh says what it
      # removes and why. On a cancel the copy exists only if verify-mobile.sh's exit trap ran
      # before the runner killed it; if it did not, `if-no-files-found: warn` says so.
      - name: Upload API and mailbox logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: suite-logs-${{ github.job }}-run${{ github.run_id }}-${{ github.sha }}
          path: mobile/build/suite-logs/
          if-no-files-found: warn
          retention-days: 5
