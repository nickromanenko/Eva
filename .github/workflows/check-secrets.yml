# Runs scripts/verify-secrets.sh — the mechanical form of GUARDRAILS 1 — on every pull
# request (#297).
#
# Before this, the script ran only inside scripts/verify.sh, which nothing in CI calls. Both
# credential accidents so far — the `.p8` in #7 and the `api/.secrets` symlink in #292
# (#295) — reached `main` through a blanket `git add -A` that no CI step looked at.
#
# No path filter, on purpose. Every other test workflow is path-filtered because its suite
# only cares about one surface; a credential can land at any path, and a filter would be a
# list of places a key is allowed to hide.
#
# Needs no credentials of any kind: the script reads tracked files and nothing else. No
# Workload Identity, no `id-token` permission, no secrets — a `pull_request` workflow runs
# code from the branch, and this one can reach nothing.
#
# `push` to `main` as well as `pull_request`: a direct push or an admin merge skips the PR
# check, and the run on `main` is what says whether `main` itself is clean.
#
# It reports; it does not block the merge on its own. Making it a required check on `main`
# is a repository setting for a human (ARCHITECTURE.md §6a).
name: Check Secrets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The script checks the tracked tree, not history, so one commit is enough.
          fetch-depth: 1
          # Nothing after checkout talks to GitHub, so the token has no reason to stay
          # on disk in .git/config.
          persist-credentials: false

      - name: Refuse committed credentials
        run: scripts/verify-secrets.sh
